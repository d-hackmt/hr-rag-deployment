name: deploy

# CI/CD: on every push to main, build the Docker image, push it to Amazon ECR,
# then tell the EC2 box (over AWS SSM, no SSH) to pull it and restart the
# container. See docs/09_cicd_aws_ecr_ec2.md for the full explanation + setup.

on:
  push:
    branches: [main]
  workflow_dispatch: {}      # lets you also run it by hand from the Actions tab

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never interrupt a deploy that's mid-flight

permissions:
  id-token: write   # required for AWS OIDC (no stored AWS keys)
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: hr-assistant
  SSM_ENV_PARAM: /hr-assistant/env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "IMAGE=$IMAGE:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Sync runtime .env to SSM Parameter Store
        run: |
          # The whole .env file lives in the GitHub secret APP_ENV_FILE.
          # Push it into Parameter Store (encrypted) so the EC2 box can read it.
          printf '%s' "${{ secrets.APP_ENV_FILE }}" > runtime.env
          aws ssm put-parameter \
            --name "$SSM_ENV_PARAM" \
            --type SecureString \
            --value "$(cat runtime.env)" \
            --overwrite \
            --query Version --output text
          rm -f runtime.env

      - name: Deploy on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # Fill the ${...} placeholders in deploy/remote.sh with real values.
          rendered=$(IMAGE="$IMAGE" REGISTRY="$REGISTRY" AWS_REGION="$AWS_REGION" SSM_ENV_PARAM="$SSM_ENV_PARAM" \
            envsubst '$IMAGE $REGISTRY $AWS_REGION $SSM_ENV_PARAM' < deploy/remote.sh)

          # Turn the script into the JSON shape `ssm send-command` wants.
          payload=$(jq -Rn --arg s "$rendered" \
            '{commands: ($s | split("\n")), executionTimeout: ["600"]}')

          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --parameters "$payload" \
            --query Command.CommandId --output text)
          echo "SSM CommandId: $cmd_id"

          # Wait for it to finish, then print what happened on the box.
          sleep 5   # let the invocation become queryable
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$INSTANCE_ID" || true

          echo "----- remote stdout -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- remote stderr -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "Remote status: $status"
          test "$status" = "Success"
